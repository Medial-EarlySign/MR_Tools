# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Generate and Deploy Sphinx API Documentation

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install sphinx numpy pandas plotly sqlalchemy
        python -m pip install medpython
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build docs
      run: |
        export ETL_DIR=$(realpath RepoLoadUtils/common)
        cd RepoLoadUtils/common/ETL_Infra/docs
        export PYTHONPATH=${ETL_DIR}
        make html
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: RepoLoadUtils/common/ETL_Infra/docs/build/html
        publish_branch: doc-pages
