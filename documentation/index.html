<html>
<head>
<title>Ask a question</title>
<style>
 p {
        white-space: pre;
        color: black;
        background: pink;
        white-space: pre-wrap;
        white-space: -moz-pre-wrap;
        white-space: -pre-wrap;
        white-space: -o-pre-wrap;
        word-wrap: break-word;
    }
</style>
</head>
<body>
	<form>
		<label for="w3review">Query:</label><br/>

		<textarea id="query" name="query" rows="10" cols="50">can you show me how to train a model with medpython?</textarea><br/>
		<br/>
		<label for="temperature">Temperture: </label>
		<input id="temperature" type="number" value="0.2"></input>
		<label for="top_k">Top K: </label>
		<input id="top_k" type="number" value="3"></input>

		<br/>
		<input id="send" type="button" value="Send"></input>
	</form>
	<span>Response:</span>
	<p>
	<code id="answer"></code>
	</p>
	<span id="timer"></span> <br/>
	
	Sources: <br/>
	<span id="sources"></span>
	
	<script>
async function sendData(data) {
  // Construct a FormData instance
  document.querySelector("#answer").innerHTML = "Please wait...";
  var startTime = performance.now();
  var url='http://localhost:8001';
  // Add a text field
  q=document.querySelector("#query").value;
  temperature = document.querySelector("#temperature").value;
  top_k = document.querySelector("#top_k").value;
  var data = JSON.stringify({"query": q, "temperature": temperature,  "k": top_k});
  // Add a file
  

  try {
    const response = await fetch(url, {
      method: "POST",
      // Set the FormData instance as the request body
      body: data,
    });
    resp = await response.json();
	var endTime = performance.now();
	var time_took_seconds =  Math.floor((endTime-startTime)/1000);
	var unit = 'Seconds';
	if (time_took_seconds >= 180) {
		time_took_seconds = Math.round(time_took_seconds/6)/10;
		unit = 'Minutes';
	}
	if ('response' in resp) {
		text=resp['response'];
		document.querySelector("#answer").innerHTML = text;
	}
	else {
		document.querySelector("#answer").innerHTML = JSON.stringify(resp);
	}
	document.querySelector("#timer").innerHTML = 'Took ' + time_took_seconds.toString() + ' ' + unit;
	if ('sources' in resp) {
		sources_obj = resp['sources'];
		for (const source of sources_obj) {
			document.querySelector("#sources").innerHTML += source + '<br/>' ;
		}
	}
  } catch (e) {
    console.error(e);
	document.querySelector("#answer").innerHTML= e;
  }
}

const send = document.querySelector("#send");
send.addEventListener("click", sendData);
</script>
	
</body>
</html>
